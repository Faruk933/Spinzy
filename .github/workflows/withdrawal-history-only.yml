name: Show withdrawal records only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Remove temporary withdrawal history workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='<div class="label">Transaction History</div>'
          new='<div class="label">Withdrawal History</div>'
          if old in s:
              s=s.replace(old,new,1)
          old2="const rows=Array.isArray(d.transactions)?d.transactions:[];"
          new2="const rows=(Array.isArray(d.transactions)?d.transactions:[]).filter(t=>t.type==='cashout');"
          if old2 in s:
              s=s.replace(old2,new2,1)
          old3="const label=t.type==='cashout'?'Withdrawal':\n      t.type==='spin_reward'?'Spin reward':\n      t.type==='ad_reward'?'Ad reward':\n      t.type==='referral_reward'?'Referral reward':\n      t.type.replaceAll('_',' ');"
          new3="const label='Withdrawal';"
          if old3 in s:
              s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || git commit -m 'Show withdrawal records only'
          rm -f .github/workflows/withdrawal-history-only.yml
          git add .github/workflows/withdrawal-history-only.yml
          git diff --cached --quiet || git commit -m 'Remove temporary withdrawal history workflow'
          git push