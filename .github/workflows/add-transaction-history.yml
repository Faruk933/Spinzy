name: Add transaction history
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch wallet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='<section id="walletPage" class="page"><div class="page-title">💳 Wallet</div><section class="extra page-card"><div class="label">Cash out</div><div class="muted">Minimum cashout is $3.00 • USDT / USDC on Base only</div><input id="cashAmount" type="number" min="3" step="0.01" placeholder="Amount (USD)"><select id="method"><option value="">Select withdrawal method</option><option value="usdt">USDT on Base</option><option value="usdc">USDC on Base</option></select><input id="destination" placeholder="Base wallet address"><button id="cashBtn" class="action wide" style="margin-top:8px">Request Cashout</button></section></section>'
          new=old.replace('</section></section>','</section><section class="extra page-card"><div class="label">Transaction History</div><div id="transactionHistory" class="transactions"><div class="muted">Loading transactions…</div></div></section></section>',1)
          if old not in s: raise SystemExit('wallet section not found')
          s=s.replace(old,new,1)
          css='.page-title{text-align:center;font-size:24px;font-weight:900;margin:8px 0 18px}.page-card{margin-top:12px}'
          css2=css+'.transactions{display:grid;gap:8px;margin-top:10px}.tx-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.tx-row:first-child{border-top:0}.tx-row b{display:block;text-transform:capitalize;font-size:13px}.tx-row small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.tx-positive{color:#8fffc4}.tx-negative{color:#ff8a9f}'
          if css not in s: raise SystemExit('css anchor not found')
          s=s.replace(css,css2,1)
          anchor="function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'});if(page==='referralPage')loadReferral()}"
          replacement="async function loadTransactions(){const box=$('transactionHistory');if(!box)return;try{const d=await api('transaction-history');const rows=Array.isArray(d.transactions)?d.transactions:[];if(!rows.length){box.innerHTML='<div class=\"muted\">No transactions yet.</div>';return}box.innerHTML=rows.map(t=>{const amount=Number(t.amount||0);const sign=amount>0?'+':'';const cls=amount>0?'tx-positive':amount<0?'tx-negative':'';const label=t.type==='cashout'?'Withdrawal':t.type==='spin_reward'?'Spin reward':t.type==='ad_reward'?'Ad reward':t.type==='referral_reward'?'Referral reward':t.type.replaceAll('_',' ');const date=new Date(t.created_at).toLocaleString();return `<div class=\"tx-row\"><div><b>${label}</b><small>${date}</small></div><strong class=\"${cls}\">${amount!==0?sign+'$'+Math.abs(amount).toFixed(3):((Number(t.coins||0)>0?'+':'')+Number(t.coins||0).toLocaleString()+' coins')}</strong></div>`}).join('')}catch(e){box.innerHTML='<div class=\"muted\">Transaction history is temporarily unavailable.</div>'}}function showPage(page){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('active',p.id===page));document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.page===page));window.scrollTo({top:0,behavior:'smooth'});if(page==='referralPage')loadReferral();if(page==='walletPage')loadTransactions()}"
          if anchor not in s: raise SystemExit('showPage anchor not found')
          s=s.replace(anchor,replacement,1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Add wallet transaction history"
          git rm .github/workflows/add-transaction-history.yml
          git commit -m "Remove transaction history workflow"
          git push
