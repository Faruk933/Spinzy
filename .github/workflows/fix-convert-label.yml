name: Fix Spinzy conversion label
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update conversion labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s2 = s.replace('1,000 coins<br>= 1 spin', '500 coins<br>= 1 spin').replace('🪙 Convert 1,000 → 1 Spin', '🪙 Convert 500 → 1 Spin')
          if s2 != s:
              p.write_text(s2)
              print('Updated conversion labels')
          else:
              print('No label changes needed')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix dashboard conversion label to 500 coins'
          git push
