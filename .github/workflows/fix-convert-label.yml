name: One-time Spinzy UI fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wallet withdrawal methods
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              '<div class="muted">Minimum cashout is $3.00</div><input id="cashAmount" type="number" min="3" step="0.01" placeholder="Amount (USD)"><select id="method"><option value="">Select method</option><option value="bank">Bank</option><option value="crypto">Crypto</option></select><input id="destination" placeholder="Destination / account">': '<div class="muted">Minimum cashout is $3.00 • USDT / USDC on Base only</div><input id="cashAmount" type="number" min="3" step="0.01" placeholder="Amount (USD)"><select id="method"><option value="">Select withdrawal method</option><option value="usdt">USDT on Base</option><option value="usdc">USDC on Base</option></select><input id="destination" placeholder="Base wallet address">',
              "$('<convertBtn>').disabled=Number(u.coins||0)<1000": "$('<convertBtn>').disabled=Number(u.coins||0)<500",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/fix-convert-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-convert-label.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Fix wallet withdrawal methods'
          git push
