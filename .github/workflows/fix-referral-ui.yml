name: Fix referral reward text

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix referral reward UI text'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update referral text and remove temporary workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = 'When a friend joins through your referral and completes their first free spin, you earn 1 spin.'
          new = 'When a friend joins through your referral and completes their first free spin, you earn 3 spins.'
          if old not in s:
              raise SystemExit('Expected referral text not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/fix-referral-ui.yml
          git add index.html .github/workflows/fix-referral-ui.yml
          git commit -m 'Fix referral reward UI text'
          git push